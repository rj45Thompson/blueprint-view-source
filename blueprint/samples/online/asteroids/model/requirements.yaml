# What the asteroid shooter does, READ from its nodes (derived: the code spaces in generated.yaml map each one), and what the chain
# needs that the code does not say (inferred: each `why` is the question, for the Blueprints' author). `measure` says where it shows;
# `effect` is what the converted code must hold, checked by tools/logic_map.py (EffectCheck) and planted the other way. Where the
# author's own comment box beside the code says the same, `measure` quotes it (BP-AS-NOTES): a second source, not a guess.
requirements:
  # the title screen (UC-AS1)
  - {id: AS-1, kind: derived, text: "When the title level begins it marks the ship as on the title screen, blends the view to the title's camera at once, and a frame later has the controller remove its UI", measure: "b_IsTitleScreen <- true at ReceiveBeginPlay(TitleScreen)#s2; SetViewTargetWithBlend(CameraActor_1, 0) at #s3; DelayUntilNextTick at #s4; DestroyUI at #s6. The author's note: 'When ported to the title screen, the camera is changed and the UI removed'",
     effect: [{sets: "b_IsTitleScreen", to: "true", at: "ReceiveBeginPlay(TitleScreen)#s1:then"},
              {calls: "SetViewTargetWithBlend", args: ["CameraActor_1"], at: "ReceiveBeginPlay(TitleScreen)#s1:then"},
              {calls: "DestroyUI", at: "ReceiveBeginPlay(TitleScreen)#s5:then"}]}
  # shooting (UC-AS1, UC-AS3)
  - {id: AS-2, kind: derived, text: "Pressing Shoot on the title screen opens Level1; during play it spawns a shot (BP_Projectile) at the ship's muzzle, ProjectileSpawn", measure: "if b_IsTitleScreen at InputActionShoot#s1; OpenLevelBySoftObjectPtr(Level1) at #s2; SpawnActor(BP_Projectile, ProjectileSpawn's world location) at #s3. The author's note: 'Spawns projectile at the position of the spaceship when key is pressed unless the player is in the title screen'",
     effect: [{branches: "b_IsTitleScreen", at: "InputActionShoot#s1"},
              {calls: "OpenLevelBySoftObjectPtr", args: ["Level1"], at: "InputActionShoot#s1:then"},
              {calls: "SpawnActor", args: ["BP_Projectile", "ProjectileSpawn"], at: "InputActionShoot#s1:else"}]}
  # turning (UC-AS2)
  - {id: AS-3, kind: derived, text: "Pushing the Move Right / Left axis sets the control rotation's yaw to the ship's yaw plus the push times RotationSpeed, pitch and roll 0: at rest the yaw is kept", measure: "SetControlRotation(Yaw = AxisValue x RotationSpeed + the player character's yaw) at InputAxisMoveRight/Left#s1",
     effect: [{calls: "SetControlRotation", args: ["AxisValue", "RotationSpeed"], at: "InputAxisMoveRight/Left#s1"}]}
  # the shot (UC-AS3)
  - {id: AS-4, kind: derived, text: "A shot's Timeline moves its RenderComponent from where the shot spawned to the middle (0, 0, 0) as the track NewTrack_0 runs, and destroys the shot when it finishes", measure: "RenderComponent.K2_SetWorldLocation(VLerp(the actor's location, (0, 0, 0), NewTrack_0)) on the Timeline's Update at ReceiveBeginPlay(BP_Projectile)#s4; K2_DestroyActor on Finished at #s7. The author's note: 'Projectiles move towards the center of the screen'",
     effect: [{calls: "K2_SetWorldLocation", args: ["RenderComponent", "VLerp", "X = 0, Y = 0, Z = 0"], at: "ReceiveBeginPlay(BP_Projectile)#s4"},
              {calls: "K2_DestroyActor", at: "ReceiveBeginPlay(BP_Projectile)#s7"}]}
  # the spawner (UC-AS4)
  - {id: AS-5, kind: derived, text: "When the spawner begins play it starts a looping timer that runs CustomEvent_0 every 2 seconds", measure: "K2_SetTimerDelegate(CustomEvent_0, 2, looping) at ReceiveBeginPlay(BP_EnemyLogic)#s1. The author's note: 'Spawns an asteroid every two seconds with a 10% chance'",
     effect: [{calls: "K2_SetTimerDelegate", args: ["CustomEvent_0", "2f, true"], at: "ReceiveBeginPlay(BP_EnemyLogic)#s1"}]}
  - {id: AS-6, kind: derived, text: "Each run of CustomEvent_0 rolls a whole number from 1 to 10 and spawns an asteroid at the middle (0, 0, 0) only on a 10: a 10% chance; on any other roll nothing is spawned", measure: "RandomIntegerInRange(1, 10) = 10 at CustomEvent_0#s1; SpawnActor(BP_Asteorid, at (0, 0, 0)) at #s2. The author's note: 'with a 10% chance'",
     effect: [{branches: "RandomIntegerInRange", at: "CustomEvent_0#s1"},
              {calls: "SpawnActor", args: ["BP_Asteorid", "X = 0, Y = 0, Z = 0"], at: "CustomEvent_0#s1:then"}]}
  - {id: AS-7, kind: derived, text: "Each run of CustomEvent_1 spawns an enemy ship (BP_EnemyShip) at the middle at 0.3 of its size", measure: "SpawnActor(BP_EnemyShip, at (0, 0, 0), scale 0.3) at CustomEvent_1#s1",
     effect: [{calls: "SpawnActor", args: ["BP_EnemyShip", "X = 0.3"], at: "CustomEvent_1#s1"}]}
  # the asteroid (UC-AS5)
  - {id: AS-8, kind: derived, text: "When an asteroid begins play it aims at the player's sprite: AimVector is the unit direction from it to the sprite, turned 20 degrees left or right at random", measure: "AimVector <- GetDirectionUnitVector(its location, the sprite's) turned by a Rotator of yaw SelectFloat(20, -20, RandomBool()) at ReceiveBeginPlay(BP_Meteor)#s2 (KismetMathLibrary.inl:1549, a vector turned by a rotator). The author's note: 'based on the player position but slightly offset to the left or right'",
     effect: [{branches: "BP_Character", at: "ReceiveBeginPlay(BP_Meteor)#s1"},
              {sets: "AimVector", at: "ReceiveBeginPlay(BP_Meteor)#s1:then"},
              {calls: "SelectFloat", args: ["20, -20"], at: "ReceiveBeginPlay(BP_Meteor)#s2"}]}
  - {id: AS-9, kind: derived, text: "Every frame an asteroid moves by AimVector times Speed times the frame's time, without a sweep, and its scale becomes 0.5 plus its distance from the middle over 150, at most 1: half size at the middle, 1.5 from 150 units out", measure: "K2_SetActorLocation(AimVector x DeltaSeconds x Speed + location, no sweep) at ReceiveTick(BP_Asteorid)#s1; SetActorScale3D(FClamp(VSize(location) / 150, 0, 1) + 0.5) at #s2. The author's note: 'make it adjust its own size based on its distance to the center of the screen'",
     effect: [{calls: "K2_SetActorLocation", args: ["AimVector", "Speed"], at: "ReceiveTick(BP_Asteorid)#s1"},
              {calls: "SetActorScale3D", args: ["150", "0.5"], at: "ReceiveTick(BP_Asteorid)#s2"}]}
  - {id: AS-10, kind: derived, text: "An asteroid that begins to overlap the ship (a BP_Character) costs the player a life: it calls ReduceLives on the player character", measure: "GetObjectClass(OtherActor) = BP_Character at OnComponentBeginOverlap(Sphere)(BP_Asteorid)#s1; GetPlayerCharacter(0).ReduceLives() at #s2",
     effect: [{branches: "BP_Character", at: "OnComponentBeginOverlap(Sphere)(BP_Asteorid)#s1"},
              {calls: "ReduceLives", at: "OnComponentBeginOverlap(Sphere)(BP_Asteorid)#s1:then"}]}
  - {id: AS-11, kind: derived, text: "A shot (a BP_Projectile) that begins to overlap an asteroid adds 100 to the score and is destroyed; anything that is neither the ship nor a shot changes nothing", measure: "GetObjectClass(OtherActor) = BP_Projectile at OnComponentBeginOverlap(Sphere)(BP_Asteorid)#s3; AddScore(100) at #s4; OtherActor.K2_DestroyActor() at #s5; nothing on #s3's else side",
     effect: [{branches: "BP_Projectile", at: "OnComponentBeginOverlap(Sphere)(BP_Asteorid)#s3"},
              {calls: "AddScore", args: ["100"], at: "OnComponentBeginOverlap(Sphere)(BP_Asteorid)#s3:then"},
              {calls: "K2_DestroyActor", args: ["OtherActor"], at: "OnComponentBeginOverlap(Sphere)(BP_Asteorid)#s5"}]}
  # the enemy ship (UC-AS6, UC-AS7, UC-AS8)
  - {id: AS-12, kind: derived, text: "Every frame an enemy ship sets its Speed to 100, adds Speed times the frame's time to the Distance it has flown, is placed and turned as its Spline is at that distance, scales to 0.1 plus its distance from the middle over 200 (at most 0.2 more: full size from 40 units out), and is destroyed once Distance passes the spline's length; before that it flies on", measure: "Speed <- 100 at ReceiveTick(BP_EnemyShip)#s1; Distance <- DeltaSeconds x Speed + Distance at #s2; K2_SetActorLocationAndRotation(the spline's location and rotation at Distance) at #s3; SetActorScale3D(FClamp(VSize / 200, 0, 0.2) + 0.1) at #s4; Distance > GetSplineLength() at #s5; K2_DestroyActor at #s6. The author's note: 'follow along its spline with a set speed, scale along the way based on its position and makes it delete itself after finishing'",
     effect: [{sets: "Speed", to: "100", at: "ReceiveTick(BP_EnemyShip)#s1"},
              {sets: "Distance", at: "ReceiveTick(BP_EnemyShip)#s2"},
              {calls: "GetLocationAtDistanceAlongSpline", args: ["Distance"], at: "ReceiveTick(BP_EnemyShip)#s3"},
              {calls: "SetActorScale3D", args: ["200", "0.2", "0.1"], at: "ReceiveTick(BP_EnemyShip)#s4"},
              {branches: "GetSplineLength", at: "ReceiveTick(BP_EnemyShip)#s5"},
              {calls: "K2_DestroyActor", at: "ReceiveTick(BP_EnemyShip)#s5:then"}]}
  - {id: AS-13, kind: derived, text: "An enemy ship waits DelayUntilShooting after it appears, then rolls a whole number from 1 to 3 and only on a 3 spawns one bullet (BP_EnemyProjectile) where it is: a 1 in 3 chance, once per ship", measure: "Delay(DelayUntilShooting) at ReceiveBeginPlay(BP_EnemyShip)#s1; RandomIntegerInRange(1, 3) = 3 at #s2; SpawnActor(BP_EnemyProjectile, at its location) at #s3. The author's note: 'spawn a projectile a short time after spawning with a chance of 1/3'",
     effect: [{calls: "Delay", args: ["DelayUntilShooting"], at: "ReceiveBeginPlay(BP_EnemyShip)#s1"},
              {branches: "RandomIntegerInRange", at: "ReceiveBeginPlay(BP_EnemyShip)#s2"},
              {calls: "SpawnActor", args: ["BP_EnemyProjectile"], at: "ReceiveBeginPlay(BP_EnemyShip)#s2:then"}]}
  - {id: AS-14, kind: derived, text: "A shot (a BP_Projectile) that begins to overlap an enemy ship's HitboxEnemy is destroyed, adds HitEnemyShipScore to the score, leaves an explosion (BP_Explosion) where the ship is, and the ship is destroyed; anything else that touches the ship changes nothing", measure: "GetObjectClass(OtherActor) = BP_Projectile at OnComponentBeginOverlap(HitboxEnemy)#s1; OtherActor.K2_DestroyActor() at #s2; AddScore(HitEnemyShipScore) at #s3; SpawnActor(BP_Explosion) at #s4; K2_DestroyActor() at #s5. The author's note: 'both get destroyed, score is added and a little animation plays'",
     effect: [{branches: "BP_Projectile", at: "OnComponentBeginOverlap(HitboxEnemy)#s1"},
              {calls: "K2_DestroyActor", args: ["OtherActor"], at: "OnComponentBeginOverlap(HitboxEnemy)#s2"},
              {calls: "AddScore", args: ["HitEnemyShipScore"], at: "OnComponentBeginOverlap(HitboxEnemy)#s1:then"},
              {calls: "SpawnActor", args: ["BP_Explosion"], at: "OnComponentBeginOverlap(HitboxEnemy)#s1:then"},
              {calls: "K2_DestroyActor", at: "OnComponentBeginOverlap(HitboxEnemy)#s5"}]}
  # the enemy bullet (UC-AS7, UC-AS9)
  - {id: AS-15, kind: derived, text: "When an enemy bullet begins play it aims straight at the player's sprite: Aim_Vector is the unit direction from it to the sprite", measure: "Aim_Vector <- GetDirectionUnitVector(its location, the sprite's), turned by a zero Rotator, at ReceiveBeginPlay(BP_EnemyProjectile)#s2. The author's note: 'Gets the location of the player ship to create an aim vector the bullet can follow'",
     effect: [{branches: "BP_Character", at: "ReceiveBeginPlay(BP_EnemyProjectile)#s1"},
              {sets: "Aim_Vector", at: "ReceiveBeginPlay(BP_EnemyProjectile)#s1:then"}]}
  - {id: AS-16, kind: derived, text: "Every frame an enemy bullet moves by Aim_Vector times Speed times the frame's time, without a sweep", measure: "K2_SetActorLocation(Aim_Vector x DeltaSeconds x Speed + location, no sweep) at ReceiveTick(BP_EnemyProjectile)#s1",
     effect: [{calls: "K2_SetActorLocation", args: ["Aim_Vector", "Speed"], at: "ReceiveTick(BP_EnemyProjectile)#s1"}]}
  - {id: AS-17, kind: derived, text: "An enemy bullet that begins to overlap the ship (a BP_Character) costs the player a life and is destroyed; anything else it touches changes nothing", measure: "GetObjectClass(OtherActor) = BP_Character at OnComponentBeginOverlap(Sphere)(BP_EnemyProjectile)#s1; ReduceLives at #s2; K2_DestroyActor() at #s3. The author's note: 'If the player is hit by the bullet, the bullet is deleted and reduce lives is called'",
     effect: [{branches: "BP_Character", at: "OnComponentBeginOverlap(Sphere)(BP_EnemyProjectile)#s1"},
              {calls: "ReduceLives", at: "OnComponentBeginOverlap(Sphere)(BP_EnemyProjectile)#s1:then"},
              {calls: "K2_DestroyActor", at: "OnComponentBeginOverlap(Sphere)(BP_EnemyProjectile)#s3"}]}
  # losing a life (UC-AS9)
  - {id: AS-18, kind: derived, text: "ReduceLives runs its body once and then stays shut until the ship has flashed back in (a DoOnce, Start Closed false: the first hit always counts): it shuts, takes one from Lives, and a hit while it is shut costs nothing", measure: "the DoOnce macro as the converter writes it (StandardMacros.t3d:340): DoOnce_0_Started <- true at ReduceLives#s2; the literal Start Closed at #s3; if not DoOnce_0_Closed at #s5; DoOnce_0_Closed <- true at #s6; Lives <- Lives - 1 at #s7. The author's note: 'they grant invincibility frames'",
     effect: [{sets: "DoOnce_0_Started", to: "true", at: "ReduceLives#s2"},
              {branches: "DoOnce_0_Closed", at: "ReduceLives#s5"},
              {sets: "DoOnce_0_Closed", to: "true", at: "ReduceLives#s6"},
              {sets: "Lives", to: "Lives - 1", at: "ReduceLives#s7"}]}
  - {id: AS-19, kind: derived, text: "A life lost hides one of the three life icons of the score widget: Life1 when 2 lives are left, Life2 at 1, Life3 at 0; at -1 none", measure: "the controller cast at ReduceLives#s8; switch on Lives at #s9: case 0 Life3 (#s13), case 1 Life2 (#s16), case 2 Life1 (#s19), default nothing",
     effect: [{branches: "BP_Controller", at: "ReduceLives#s8"},
              {calls: "SetVisibility", args: ["Life3", "Hidden"], at: "ReduceLives#s9:k12"},
              {calls: "SetVisibility", args: ["Life2", "Hidden"], at: "ReduceLives#s9:k15"},
              {calls: "SetVisibility", args: ["Life1", "Hidden"], at: "ReduceLives#s9:k18"}]}
  - {id: AS-20, kind: derived, text: "A hit blows the ship up: an explosion (BP_Explosion) where its sprite is, the sprite hidden, the ship turned back to its start (rotation 0), then a 0.2 s pause", measure: "SpawnActor(BP_Explosion, at the Sprite) at ReduceLives#s21; Sprite.SetVisibility(false) at #s22; K2_SetActorRotation(0, 0, 0) at #s23; Delay(0.2) at #s24. The author's note: 'When hit an animation plays, the player position is reset'",
     effect: [{calls: "SpawnActor", args: ["BP_Explosion", "Sprite"], at: "ReduceLives#s21"},
              {calls: "SetVisibility", args: ["false, false"], at: "ReduceLives#s22"},
              {calls: "K2_SetActorRotation", args: ["Yaw = 0"], at: "ReduceLives#s23"},
              {calls: "Delay", args: ["0.2f"], at: "ReduceLives#s24"}]}
  - {id: AS-21, kind: derived, text: "With a life left (Lives is not -1) the ship flashes back in - shown, hidden, shown, hidden, shown, FlashInterval apart - and ReduceLives opens again", measure: "Lives != -1 at ReduceLives#s25; SetVisibility true/false and Delay(FlashInterval) at #s26-#s34; DoOnce_0_Closed <- false at #s35. The author's note: 'a blinking effect to indicate that'",
     effect: [{branches: "Lives", at: "ReduceLives#s25"},
              {calls: "Delay", args: ["FlashInterval"], at: "ReduceLives#s25:then"},
              {calls: "SetVisibility", args: ["true, false"], at: "ReduceLives#s25:then"},
              {sets: "DoOnce_0_Closed", to: "false", at: "ReduceLives#s35"}]}
  - {id: AS-22, kind: derived, text: "With no life left (Lives is -1) the title screen opens, and ReduceLives stays shut", measure: "OpenLevelBySoftObjectPtr(TitleScreen) at ReduceLives#s37, on #s25's else side, which never reopens the DoOnce. The author's note: 'in a case of game over the player gets ported to the title screen'",
     effect: [{calls: "OpenLevelBySoftObjectPtr", args: ["TitleScreen"], at: "ReduceLives#s25:else"}]}
  # the score (UC-AS10)
  - {id: AS-23, kind: derived, text: "When the controller begins play it creates the score widget (BP_Score), adds it to the screen and keeps it as ScoreWidget", measure: "CreateWidget(BP_Score) at ReceiveBeginPlay(BP_Controller)#s1; AddToViewport at #s2; ScoreWidget <- it at #s3. The author's note: 'Adds the scoring UI to the screen'",
     effect: [{calls: "CreateWidget", args: ["BP_Score"], at: "ReceiveBeginPlay(BP_Controller)#s1"},
              {calls: "AddToViewport", at: "ReceiveBeginPlay(BP_Controller)#s2"},
              {sets: "ScoreWidget", at: "ReceiveBeginPlay(BP_Controller)#s3"}]}
  - {id: AS-24, kind: derived, text: "AddScore adds ScoreToAdd to Score and hands the widget the new total as text, grouped by thousands with up to 3 decimals: the text conversion's defaults, left as they are", measure: "Score <- Score + ScoreToAdd at AddScore#s1; UpdateScore(Conv_DoubleToText(Score, HalfToEven, false, true, 1, 324, 0, 3)) at #s2 - the last six are the engine's defaults (KismetTextLibrary.h:248). The author's note: 'Adds score to the scoring UI'",
     effect: [{sets: "Score", to: "(Score + ScoreToAdd)", at: "AddScore#s1"},
              {calls: "UpdateScore", args: ["Conv_DoubleToText"], at: "AddScore#s2"}]}

  # what the chain needs that the pastes do not say: each a question for the author
  - {id: IR-AS-1, kind: inferred, text: "BP_Meteor and BP_Asteorid are one Blueprint, renamed: the asteroid takes its aim from BP_Meteor's ReceiveBeginPlay, and BP_Asteorid's Tick (which adds the growth) supersedes BP_Meteor's", measure: "the two classes' AimVector share the variable GUID EBE68DD14675C7C09C67128E0426CB0C and their Speed 306456984F814390AFE48CAC88437A4E, and BP_Asteorid's overlap event is still named BndEvt__BP_Meteor_Sphere...; BP_Asteorid's own paste holds no BeginPlay, so nothing in it writes AimVector", why: "Q-UNWRITTEN.BP_Asteorid.AimVector: the GUIDs make one Blueprint likely, they do not prove BP_Meteor's copy is current - is BP_Meteor the asteroid's earlier name, and is its BeginPlay still the asteroid's?",
     effect: {absent: "which Blueprint the BP_Meteor graphs belong to today is the owner's to say: the evidence is a GUID match, not a statement"}}
  - {id: IR-AS-2, kind: inferred, text: "Every speed is set before play, to values the author names: the asteroid's Speed (BP_Meteor's, the same variable), the enemy bullet's Speed and the ship's RotationSpeed", measure: "Speed is read at ReceiveTick(BP_Asteorid)#s1, ReceiveTick(BP_Meteor)#s1 and ReceiveTick(BP_EnemyProjectile)#s1, RotationSpeed at InputAxisMoveRight/Left#s1; none is written in the pastes", why: "Q-UNWRITTEN.BP_Asteorid.Speed, BP_Meteor.Speed, BP_EnemyProjectile.Speed and RotationSpeed: class defaults the pastes do not hold, or code that was not pasted?",
     effect: {absent: "the values live in the Blueprints' class defaults, which a paste of their graphs does not carry"}}
  - {id: IR-AS-3, kind: inferred, text: "How long a ship waits before it may fire (DelayUntilShooting), how fast a hit ship flashes (FlashInterval), and the 0.2 s before the flashing starts, are named design values set before play", measure: "DelayUntilShooting is read at ReceiveBeginPlay(BP_EnemyShip)#s1 and FlashInterval at ReduceLives#s27, #s29, #s31, #s33, both written nowhere in the pastes; 0.2 is written into ReduceLives#s24", why: "Q-UNWRITTEN.DelayUntilShooting, Q-UNWRITTEN.FlashInterval and Q-LITERAL.ReduceLives#s24: what are the two defaults, and should the 0.2 be one of them?",
     effect: {absent: "the two values live in class defaults the pastes do not carry; the 0.2 is a literal whose owner is the author"}}
  - {id: IR-AS-4, kind: inferred, text: "What each target is worth comes from one scoring table: a ship's HitEnemyShipScore is a variable set before play, while an asteroid's 100 is written into its graph", measure: "AddScore(HitEnemyShipScore) at OnComponentBeginOverlap(HitboxEnemy)#s3, HitEnemyShipScore written nowhere in the pastes; AddScore(100) at OnComponentBeginOverlap(Sphere)(BP_Asteorid)#s4", why: "Q-UNWRITTEN.HitEnemyShipScore and Q-LITERAL.OnComponentBeginOverlap(Sphere)(BP_Asteorid)#s4: what is a ship worth, and should an asteroid's 100 be a variable like it?",
     effect: {absent: "a ship's worth lives in a class default the pastes do not carry, and where scores should live is the owner's design"}}
  - {id: IR-AS-5, kind: inferred, text: "Each enemy ship's path is a Spline built in its own Blueprint before play", measure: "Spline is read at ReceiveTick(BP_EnemyShip)#s3 and #s5 and written nowhere in the pastes", why: "Q-UNWRITTEN.Spline: the path's points are a component of BP_EnemyShip - what shape is it, and is it one path for every ship?",
     effect: {absent: "a spline's points are component data in the Blueprint, which no paste of its graphs carries"}}
  - {id: IR-AS-6, kind: inferred, text: "An enemy ship's speed is a named design value; today the variable Speed is overwritten with 100 every frame, so its default, and any change to it, has no effect", measure: "Speed <- 100 at ReceiveTick(BP_EnemyShip)#s1, the first statement of every Tick, before Speed is read at #s2", why: "Q-LITERAL.ReceiveTick(BP_EnemyShip)#s1: why is Speed a variable if every frame sets it to 100 - should the default be read instead?",
     effect: {absent: "whether Speed should be read from its default or stay 100 is the owner's call; until it is made no assertion can say which"}}
  - {id: IR-AS-7, kind: inferred, text: "How large things grow as they leave the middle (the game's perspective) is named design values: an asteroid 0.5 + min(d / 150, 1), a ship 0.1 + min(d / 200, 0.2)", measure: "the literals 150, 0, 1, 0.5 at ReceiveTick(BP_Asteorid)#s2 and 200, 0, 0.2, 0.1 at ReceiveTick(BP_EnemyShip)#s4", why: "Q-LITERAL.ReceiveTick(BP_Asteorid)#s2 and Q-LITERAL.ReceiveTick(BP_EnemyShip)#s4: where do these curves come from, and should they be one shared perspective?",
     effect: {absent: "the curves are the author's design numbers; the code holds them, it cannot say who may change them"}}
  - {id: IR-AS-8, kind: inferred, text: "The asteroid timer runs from the spawner's ReceiveBeginPlay for as long as the spawner lives: nothing in the pastes pauses it, during the flashing or at any point of a game", measure: "K2_SetTimerDelegate(CustomEvent_0, 2, looping) at ReceiveBeginPlay(BP_EnemyLogic)#s1; no K2_PauseTimerDelegate or K2_ClearTimerDelegate anywhere in the set (view/trace.js TIMER)", why: "Q-TIMER.CustomEvent_0: should asteroids keep coming while the ship flashes back in, and is a game meant to get harder over time?",
     effect: {absent: "when, if ever, the asteroids should stop is the owner's design: nothing to assert before it is said"}}
  - {id: IR-AS-9, kind: inferred, text: "Enemy ships come in waves: something starts a looping 0.5 s timer that runs CustomEvent_1, and something ends it, so that a wave holds a number of ships the author names", measure: "the ship paste's K2_SetTimerDelegate(CustomEvent_1, 0.5, looping) (BP_EnemyLogic_Ships.t3d:K2Node_CallFunction_9) is wired from K2Node_CallFunction_0, which no paste in this set holds; nothing here ends it. The author's waves are pasted as EnemyWaveSpawning and EnemySpawningMacro, left out of this set: a macro of his own, which the converter does not inline (SOURCES.json). The author's note: 'Spawns enemy ships every half a second'", why: "the epic needs ships to come out of the middle, and nothing in this set runs CustomEvent_1: what starts a wave, how many ships does it hold, and what ends it? The answer is in the author's macro, which the converter cannot read yet (ours, not his)",
     effect: {absent: "the waves are in a macro of the author's own the converter does not inline: nothing in this set to assert against"}}
  - {id: IR-AS-10, kind: inferred, text: "An asteroid is never destroyed: a shot that hits it scores 100 and is itself destroyed, and an asteroid that hits the ship costs a life and flies on through", measure: "the asteroid's overlap destroys OtherActor (the shot, OnComponentBeginOverlap(Sphere)(BP_Asteorid)#s5) and never itself; on the ship's side (#s1:then) it only calls ReduceLives", why: "Q-P1-8 'why didn't the asteroid I shot blow up?': is an asteroid meant to be something to dodge, not destroy?",
     effect: {absent: "whether an asteroid should break is the owner's design: nothing to assert before it is said"}}
  - {id: IR-AS-11, kind: inferred, text: "The ship turns with its controller, and its sprite and muzzle (ProjectileSpawn) sit away from its middle, so that turning the control rotation carries them around a ring", measure: "the move sets only the control rotation (InputAxisMoveRight/Left#s1); the shot spawns at ProjectileSpawn's world location (InputActionShoot#s3) and the aims read the Sprite's (ReceiveBeginPlay(BP_Meteor)#s2). The author's note: 'Rotating the player character to get the circular movement'", why: "how far out are the sprite and ProjectileSpawn, and is the ship set to use the controller's yaw? Both are BP_Character's components and settings, not in the pastes",
     effect: {absent: "components and pawn settings are Blueprint data no paste of its graphs carries"}}
