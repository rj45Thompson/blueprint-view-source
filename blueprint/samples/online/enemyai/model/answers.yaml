# S-Q: every question the brainstorm rules (view/trace.js QuestionRules) raise over the converted enemy, each ANSWERED by the
# requirement that settles it - a derived one when the code already says what happens (the author's note where one agrees), an
# inferred one when only the author can say. The keys are read by the gap checker itself from the trace's questions.txt: a question
# nobody answered is a U7 hole. Three of the six DUP questions are one Blueprint node the converter prints once per path that
# reaches it (K2Node_IfThenElse_12, _67): one rule, said so; the other three are copies the author made (IR-EN-15).
spaces:
  - id: S-Q
    title: every question the brainstorm rules raise over the enemy's graphs
    basis: brainstorm
    kind: extract
    file: ../trace/questions.txt
    pattern: '(?m)^question (\S+) ::'
