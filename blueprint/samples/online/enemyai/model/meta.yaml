  - {id: Q-P1-5, persona: P1, text: "How much did my spell hurt it?", inverse: UC-EN6}
  - {id: Q-P1-6, persona: P1, text: "Why does my fire hurt this one less?", inverse: UC-EN7}
  - {id: Q-P1-7, persona: P1, text: "Why can I not freeze it any more?", inverse: UC-EN8}
