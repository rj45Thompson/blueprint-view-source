  - {id: Q-P1-2, persona: P1, text: "Why did it stop chasing me?", inverse: UC-EN3}
  - {id: Q-P1-3, persona: P1, text: "Which attack will it use next, and why did it stop attacking?", inverse: UC-EN4}
